name: manifest

on:
  push:
    branches: [main]
    paths-ignore: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          node - <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const safe = /^(app\.js|main\.js|preload\.js|html\/client\.html|assets\/.*|plugins\/.*|themes\/.*)$/;
          const manifest = {};
          const out = execSync('git ls-tree -r -z HEAD', { encoding: 'utf8' });
          for (const entry of out.split('\0')) {
            const m = entry.match(/^\d+ blob ([0-9a-f]{40})\t([\s\S]+)$/);
            if (m && safe.test(m[2])) manifest[m[2]] = m[1];
          }
          const sorted = Object.fromEntries(Object.entries(manifest).sort(([a], [b]) => a.localeCompare(b)));
          fs.writeFileSync('manifest.json', JSON.stringify(sorted, null, 1) + '\n');
          EOF

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || (git commit -m "update manifest [skip ci]" && git push)