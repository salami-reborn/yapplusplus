<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        webview { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <script>
        function preloadurl(value) {
            if (!value) return '';
            if (/^file:/i.test(value)) return value;
            let normalized = String(value).replace(/\\/g, '/');
            if (normalized.charAt(0) !== '/') normalized = '/' + normalized;
            return 'file://' + encodeURI(normalized).replace(/#/g, '%23').replace(/\?/g, '%3F');
        }

        const webview = document.createElement('webview');
        webview.id = 'yapper-view';
        webview.setAttribute('partition', 'persist:yapper');
        webview.setAttribute('allowpopups', '');
        webview.setAttribute('webpreferences', 'backgroundThrottling=no');
        if (window.electronAPI && window.electronAPI.getPreloadPath) {
            const guestpreload = preloadurl(window.electronAPI.getPreloadPath());
            if (guestpreload) webview.setAttribute('preload', guestpreload);
        }

        let retrycount = 0;
        webview.addEventListener('did-finish-load', async () => {
            retrycount = 0;
            try {
                const assets = {
                    staff: await window.electronAPI.getAsset('Staffcontrib.png'),
                    helper: await window.electronAPI.getAsset('Helper.png'),
                    vim: await window.electronAPI.getAsset('Vim.png'),
                    potato: await window.electronAPI.getAsset('Cutepotato.png'),
                    whitebox: await window.electronAPI.getAsset('whiteboxbadgeidkwhy.png'),
                    sigma: await window.electronAPI.getAsset('Hefeelsverysigma.png'),
                    chud: await window.electronAPI.getAsset('CERTIFIEDCHUD.png'),
                    yppIcon: await window.electronAPI.getAsset('yppIcon.png'),
                    yapjsbadge: await window.electronAPI.getAsset('yapjsbadge.png'),
                    astolfodoodle: await window.electronAPI.getAsset('astolfo_doodle.png'),
                    gothheart: await window.electronAPI.getAsset('blackheart.png')
                };
                await webview.executeJavaScript(`window.YapPlusAssets = ${JSON.stringify(assets)};`);
                setTimeout(async () => {
                    const plugincode = await window.electronAPI.getPlugins();
                    if (plugincode && plugincode.trim().length > 0) {
                        try {
                            await webview.executeJavaScript(plugincode);
                        } catch (err) {
                            console.error('[Yap++] plugin load error:', err);
                        }
                    }
                }, 1500);

            } catch (err) {
            }
        });
        webview.addEventListener('did-fail-load', (event) => {
            if (event.isMainFrame && retrycount < 3) {
                retrycount++;
                setTimeout(() => {
                    webview.reload();
                }, 2000);
            }
        });

        webview.setAttribute('src', 'https://yapper.website');
        document.body.appendChild(webview);
    </script>
</body>
</html>
