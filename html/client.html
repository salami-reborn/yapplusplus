<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        webview { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <script>
        function preloadurl(value) {
            if (!value) return '';
            if (/^file:/i.test(value)) return value;
            let normalized = String(value).replace(/\\/g, '/');
            if (normalized.charAt(0) !== '/') normalized = '/' + normalized;
            return 'file://' + encodeURI(normalized).replace(/#/g, '%23').replace(/\?/g, '%3F');
        }

        const webview = document.createElement('webview');
        webview.id = 'yapper-view';
        webview.setAttribute('partition', 'persist:yapper');
        webview.setAttribute('allowpopups', '');
        if (window.electronAPI && window.electronAPI.getPreloadPath) {
            const guestpreload = preloadurl(window.electronAPI.getPreloadPath());
            if (guestpreload) webview.setAttribute('preload', guestpreload);
        }

        const assetFiles = {
            staff: 'Staffcontrib.png',
            helper: 'Helper.png',
            vim: 'Vim.png',
            potato: 'Cutepotato.png',
            whitebox: 'whiteboxbadgeidkwhy.png',
            sigma: 'Hefeelsverysigma.png',
            chud: 'CERTIFIEDCHUD.png',
            yppIcon: 'yppIcon.png',
            yapjsbadge: 'yapjsbadge.png',
            astolfodoodle: 'astolfo_doodle.png',
            gothheart: 'blackheart.png'
        };

        async function loadStartupCode() {
            const api = window.electronAPI;
            const entries = Object.entries(assetFiles);
            if (api.getStartupCode) {
                try {
                    return await api.getStartupCode(entries);
                } catch {
                    // Older hot copies of main.js still expose the separate handlers.
                }
            }
            const [assets, plugins] = await Promise.all([
                Promise.all(entries.map(async ([key, file]) => [
                    key, await api.getAsset(file).catch(() => null)
                ])).then(Object.fromEntries),
                api.getPlugins()
            ]);
            return plugins?.trim() ? `window.YapPlusAssets = ${JSON.stringify(assets)};\n${plugins}` : '';
        }

        // Prepare the local code while Yapin loads. Consume the snapshot once so
        // subsequent reloads pick up changes to plugins and assets.
        let initialStartupCode = loadStartupCode().catch(() => null);
        let retrycount = 0;
        let navigation = 0;
        webview.addEventListener('did-start-navigation', (event) => {
            if (event.isMainFrame && !event.isInPlace) navigation++;
        });
        webview.addEventListener('did-finish-load', () => { retrycount = 0; });
        webview.addEventListener('dom-ready', async () => {
            const documentNavigation = navigation;
            try {
                const pending = initialStartupCode;
                initialStartupCode = null;
                const code = (await pending) ?? await loadStartupCode();
                if (documentNavigation === navigation && code) {
                    await webview.executeJavaScript(code);
                }
            } catch (error) {
                console.error('[Yap++] plugin load error:', error);
            }
        });
        webview.addEventListener('did-fail-load', (event) => {
            if (!event.isMainFrame || event.errorCode === -3 || retrycount >= 3) return;
            retrycount++;
            const failedNavigation = navigation;
            setTimeout(() => {
                if (failedNavigation === navigation && retrycount > 0) webview.reload();
            }, 2000);
        });

        webview.setAttribute('src', 'https://www.yapin.gg/');
        document.body.appendChild(webview);
    </script>
</body>
</html>
